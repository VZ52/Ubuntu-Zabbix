# Zabbix 7 стек: PostgreSQL + Zabbix Server + Zabbix Web + Zabbix Agent.
# Пароли и пользователи берутся из .env (файл лежит рядом, в git не коммитится).
# Запуск: docker compose up -d

services:

  # ---------- База данных ----------
  postgres:
    image: postgres:15-alpine                  # лёгкий образ PostgreSQL 15
    container_name: zbx-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}              # имя БД, читается из .env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data # ИМЕНОВАННЫЙ том: данные переживут docker compose down
    restart: unless-stopped                    # автозапуск, если упадёт

  # ---------- Сервер Zabbix ----------
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: zbx-server
    depends_on:                                # запустится только после postgres
      - postgres
    environment:
      DB_SERVER_HOST: postgres                 # имя сервиса = DNS-имя внутри сети compose
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "10051:10051"                          # порт, на который шлют метрики агенты
    restart: unless-stopped

  # ---------- Веб-интерфейс Zabbix ----------
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: zbx-web
    depends_on:
      - postgres
      - zabbix-server
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ZBX_SERVER_HOST: zabbix-server           # к какому серверу обращаться вебке
      PHP_TZ: Europe/Moscow                    # часовой пояс для отображения времени
    ports:
      - "8080:8080"                            # вебка будет на http://localhost:8080
    restart: unless-stopped

  # ---------- Агент (мониторит сам себя) ----------
  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: zbx-agent
    depends_on:
      - zabbix-server
    environment:
      ZBX_SERVER_HOST: zabbix-server           # куда слать метрики
      ZBX_HOSTNAME: "Zabbix server"            # как этот агент представится серверу
    restart: unless-stopped

# Именованные тома Docker. Хранятся в служебной области Docker (/var/lib/docker/volumes/...)
# Чтобы их посмотреть: docker volume ls
volumes:
  postgres-data:
